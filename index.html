<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Negozio TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100vw; height:100vh; background:#000; overflow:hidden; }
    #vid {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; display:block;
    }
    #ticker {
      position:fixed; left:0; right:0; z-index:10;
      overflow:hidden; display:none;
    }
    #ticker-text {
      display:inline-block;
      white-space:nowrap;
      padding-left:100vw;
      animation:scroll-l 10s linear infinite;
    }
    @keyframes scroll-l {
      from { transform: translateX(0); }
      to   { transform: translateX(-200%); }
    }
    @keyframes scroll-r {
      from { transform: translateX(-200%); }
      to   { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <video id="vid" autoplay muted playsinline></video>
  <div id="ticker"><span id="ticker-text"></span></div>

  <script>
  (function () {
    'use strict';

    const vid   = document.getElementById('vid');
    const ticker = document.getElementById('ticker');
    const ttext  = document.getElementById('ticker-text');

    let playlist = [];
    let idx = 0;
    let refreshTimer = null;

    // ── Config ──────────────────────────────────────────────────────────
    async function fetchConfig() {
      try {
        const r = await fetch('player-config.json?t=' + Date.now());
        if (r.ok) return r.json();
      } catch (_) {}
      return { videos: [], ticker: { enabled: false } };
    }

    // ── Ticker ──────────────────────────────────────────────────────────
    function applyTicker(t) {
      if (!t || !t.enabled || !t.text) { ticker.style.display = 'none'; return; }

      ticker.style.display = 'block';
      ticker.style.padding = '10px 0';
      ticker.style.background = t.background_color || 'rgba(0,0,0,0.6)';

      if (t.position === 'top') {
        ticker.style.top  = Math.max(0, t.offset_y || 0) + 'px';
        ticker.style.bottom = 'auto';
      } else {
        ticker.style.bottom = Math.max(0, t.offset_y || 0) + 'px';
        ticker.style.top = 'auto';
      }

      ttext.textContent = t.text;
      ttext.style.fontFamily  = t.font  || 'Inter, system-ui, sans-serif';
      ttext.style.fontSize    = (t.size || 28) + 'px';
      ttext.style.fontWeight  = t.bold   ? '700' : '400';
      ttext.style.fontStyle   = t.italic ? 'italic' : 'normal';
      ttext.style.color       = t.color  || '#ffffff';

      const speed = Math.max(1, t.speed || 80);
      const dur   = Math.max(3, Math.round(600 / speed));
      ttext.style.animationDuration  = dur + 's';
      ttext.style.animationName = (t.direction === 'right') ? 'scroll-r' : 'scroll-l';
    }

    // ── Playlist ────────────────────────────────────────────────────────
    function buildPlaylist(videos) {
      playlist = (videos || []).map(v => v.filename).filter(Boolean);
    }

    function playNext() {
      if (!playlist.length) { setTimeout(init, 10000); return; }
      const file = playlist[idx % playlist.length];
      idx = (idx + 1) % playlist.length;

      vid.src = 'videos/' + encodeURIComponent(file) + '?t=' + Date.now();
      vid.load();
      vid.play().catch(() => {
        document.addEventListener('click', () => vid.play(), { once: true });
      });
    }

    vid.addEventListener('ended', playNext);
    vid.addEventListener('error', () => setTimeout(playNext, 2000));

    // ── Watchdog ────────────────────────────────────────────────────────
    let lastT = -1, stuckN = 0;
    setInterval(() => {
      if (!vid.src) return;
      if (vid.paused && !vid.ended) { vid.play().catch(() => {}); stuckN = 0; return; }
      if (!vid.paused && vid.currentTime === lastT) {
        if (++stuckN >= 3) { stuckN = 0; playNext(); }
      } else { stuckN = 0; }
      lastT = vid.currentTime;
    }, 3000);

    // ── Periodic refresh ────────────────────────────────────────────────
    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(async () => {
        const cfg = await fetchConfig();
        applyTicker(cfg.ticker);
        const wasEmpty = playlist.length === 0;
        buildPlaylist(cfg.videos);
        if (wasEmpty && playlist.length > 0) playNext();
        scheduleRefresh();
      }, 5 * 60 * 1000);
    }

    // ── Init ────────────────────────────────────────────────────────────
    async function init() {
      const cfg = await fetchConfig();
      applyTicker(cfg.ticker);
      buildPlaylist(cfg.videos);
      playNext();
      scheduleRefresh();
    }

    init();
  })();
  </script>
</body>
</html>
