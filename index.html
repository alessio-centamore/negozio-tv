<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Negozio TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@400;700&family=Bebas+Neue&family=Pacifico&family=Lobster&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700ital,wght@1,400;1,700&family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100vw; height:100vh; background:#000; overflow:hidden; }
    #vid {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; display:block;
      /* Force compositing to disable hardware video overlay on TV browsers */
      -webkit-filter: brightness(1);
      filter: brightness(1);
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      will-change: transform;
      /* opacity slightly < 1 forces GPU compositing on some Android TV browsers */
      opacity: 0.9999;
      z-index: 0;
    }
    /* Overlay container sits above the video compositing layer */
    #overlay {
      position:fixed; inset:0; z-index:10;
      pointer-events:none;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      will-change: transform;
    }
    #ticker {
      position:absolute; left:0; right:0;
      overflow:hidden; display:none;
    }
    #ticker-text {
      display:inline-block;
      white-space:nowrap;
    }
    #logo-wrap {
      position:absolute; display:none; pointer-events:none;
    }
    #logo-wrap img, #logo-wrap svg {
      display:block; width:100%; height:auto;
    }
    @-webkit-keyframes scroll-l {
      from { -webkit-transform: translateX(100vw); transform: translateX(100vw); }
      to   { -webkit-transform: translateX(calc(-100% - 100vw)); transform: translateX(calc(-100% - 100vw)); }
    }
    @keyframes scroll-l {
      from { transform: translateX(100vw); }
      to   { transform: translateX(calc(-100% - 100vw)); }
    }
    @-webkit-keyframes scroll-r {
      from { -webkit-transform: translateX(calc(100% + 100vw)); transform: translateX(calc(100% + 100vw)); }
      to   { -webkit-transform: translateX(-100vw); transform: translateX(-100vw); }
    }
    @keyframes scroll-r {
      from { transform: translateX(calc(100% + 100vw)); }
      to   { transform: translateX(-100vw); }
    }
  </style>
</head>
<body>
  <video id="vid" autoplay muted playsinline></video>
  <div id="overlay">
    <div id="ticker"><span id="ticker-text"></span></div>
    <div id="logo-wrap"><img id="logo-img" src="" alt=""></div>
  </div>

  <script>
  (function () {
    'use strict';

    const vid      = document.getElementById('vid');
    const ticker   = document.getElementById('ticker');
    const ttext    = document.getElementById('ticker-text');
    const logoWrap = document.getElementById('logo-wrap');

    let _lastLogoKey = null;

    let playlist = [];
    let idx = 0;
    let refreshTimer = null;

    async function fetchConfig() {
      try {
        const r = await fetch('player-config.json?t=' + Date.now());
        if (r.ok) return r.json();
      } catch (_) {}
      return { videos: [], ticker: { enabled: false } };
    }

    function makeOutline(px, color) {
      if (!px || px <= 0) return '';
      const s = [];
      for (let x = -px; x <= px; x++)
        for (let y = -px; y <= px; y++)
          if ((x !== 0 || y !== 0) && x * x + y * y <= px * px)
            s.push(x + 'px ' + y + 'px 0 ' + color);
      return s.join(',');
    }

    function _positionLogo(l) {
      logoWrap.style.width   = (l.size || 80) + 'px';
      logoWrap.style.opacity = l.opacity !== undefined ? l.opacity : 1;
      logoWrap.style.background   = l.bg_color || 'rgba(0,0,0,0)';
      logoWrap.style.borderRadius = l.bg_color && l.bg_color !== 'rgba(0,0,0,0)' ? '6px' : '0';
      logoWrap.style.padding      = l.bg_color && l.bg_color !== 'rgba(0,0,0,0)' ? '6px' : '0';
      const ox = (l.offset_x || 20) + 'px';
      const oy = (l.offset_y || 20) + 'px';
      logoWrap.style.top    = logoWrap.style.bottom = 'auto';
      logoWrap.style.left   = logoWrap.style.right  = 'auto';
      const pos = l.position || 'bottom-right';
      if (pos.includes('top'))  logoWrap.style.top    = oy; else logoWrap.style.bottom = oy;
      if (pos.includes('left')) logoWrap.style.left   = ox; else logoWrap.style.right  = ox;
    }

    function applyLogo(l) {
      if (!l || !l.enabled || !l.url) { logoWrap.style.display = 'none'; return; }
      logoWrap.style.display = 'block';
      _positionLogo(l);

      // Fetch SVG as text and inject inline — bypasses <img> SVG sandbox on TV browsers
      // Cache key changes every minute so logo updates are picked up
      const key = l.url + '|' + Math.floor(Date.now() / 60000);
      if (key === _lastLogoKey) return;  // already loaded this version
      _lastLogoKey = key;

      fetch(l.url + '?t=' + Date.now())
        .then(r => r.ok ? r.text() : null)
        .then(text => {
          if (!text) return;
          const clean = text
            .replace(/<\?xml[^?]*\?>/i, '')
            .replace(/<!DOCTYPE[^>]*>/i, '');
          logoWrap.innerHTML = clean;
          const svg = logoWrap.querySelector('svg');
          if (!svg) return;
          svg.style.display = 'block';
          svg.style.width   = '100%';
          svg.style.height  = 'auto';
          // Apply fill + stroke directly as attributes — bypasses CSS cascade issues
          const color   = l.color        || '#ffffff';
          const sColor  = l.stroke_color || '#000000';
          const sWidth  = l.stroke_width || 0;
          svg.querySelectorAll('*').forEach(el => {
            // Skip artboard/transparent elements
            if (el.getAttribute('fill') === 'none') return;
            if (/fill\s*:\s*none/i.test(el.getAttribute('style') || '')) return;
            const tag = (el.tagName || '').toLowerCase().replace(/.*:/, '');
            if (['defs','style','title','desc','metadata','clippath',
                 'lineargradient','radialgradient','pattern','mask','filter'].includes(tag)) return;
            el.setAttribute('fill', color);
            if (sWidth > 0) {
              el.setAttribute('stroke',       sColor);
              el.setAttribute('stroke-width', sWidth + 'px');
            } else {
              el.removeAttribute('stroke');
              el.removeAttribute('stroke-width');
            }
          });
        })
        .catch(() => {});
    }

    function applyTicker(t) {
      if (!t || !t.enabled || !t.text) { ticker.style.display = 'none'; return; }

      ticker.style.display = 'block';
      ticker.style.padding = '10px 0';
      ticker.style.background = t.background_color || 'rgba(0,0,0,0.6)';

      if (t.position === 'top') {
        ticker.style.top    = Math.max(0, t.offset_y || 0) + 'px';
        ticker.style.bottom = 'auto';
      } else {
        ticker.style.bottom = Math.max(0, t.offset_y || 0) + 'px';
        ticker.style.top    = 'auto';
      }

      ttext.textContent            = t.text;
      ttext.style.fontFamily       = t.font  || 'Inter, system-ui, sans-serif';
      ttext.style.fontSize         = (t.size || 28) + 'px';
      ttext.style.fontWeight       = t.bold   ? '700' : '400';
      ttext.style.fontStyle        = t.italic ? 'italic' : 'normal';
      ttext.style.color            = t.color  || '#ffffff';
      ttext.style.textShadow       = makeOutline(t.stroke_width || 0, t.stroke_color || '#000000');

      const speed   = Math.max(1, t.speed || 80);
      const dur     = Math.max(3, Math.round(600 / speed));
      const animName = (t.direction === 'right') ? 'scroll-r' : 'scroll-l';

      const animStr = dur + 's linear infinite ' + animName;
      ttext.style.webkitAnimation = 'none';
      ttext.style.animation = 'none';
      void ttext.offsetWidth;
      ttext.style.webkitAnimation = animStr;
      ttext.style.animation = animStr;
    }

    function buildPlaylist(videos) {
      playlist = (videos || []).map(v => v.filename).filter(Boolean);
    }

    function playNext() {
      if (!playlist.length) { setTimeout(init, 10000); return; }
      const file = playlist[idx % playlist.length];
      idx = (idx + 1) % playlist.length;
      // Single-video playlist: native loop avoids re-download and black screen
      vid.loop = playlist.length === 1;
      vid.src = 'videos/' + encodeURIComponent(file) + '?t=' + Date.now();
      vid.load();
      vid.play().catch(() => {
        document.addEventListener('click', () => vid.play(), { once: true });
      });
    }

    vid.addEventListener('ended', playNext);
    vid.addEventListener('error', () => setTimeout(playNext, 2000));

    let lastT = -1, stuckN = 0;
    setInterval(() => {
      if (!vid.src) return;
      if (vid.paused && !vid.ended) { vid.play().catch(() => {}); stuckN = 0; return; }
      if (!vid.paused && vid.currentTime === lastT) {
        if (++stuckN >= 3) { stuckN = 0; playNext(); }
      } else { stuckN = 0; }
      lastT = vid.currentTime;
    }, 3000);

    function scheduleRefresh() {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(async () => {
        const cfg = await fetchConfig();
        applyTicker(cfg.ticker);
        applyLogo(cfg.logo);
        const wasEmpty = playlist.length === 0;
        buildPlaylist(cfg.videos);
        if (wasEmpty && playlist.length > 0) playNext();
        scheduleRefresh();
      }, 20 * 1000);
    }

    async function init() {
      const cfg = await fetchConfig();
      applyTicker(cfg.ticker);
      applyLogo(cfg.logo);
      buildPlaylist(cfg.videos);
      playNext();
      scheduleRefresh();
    }

    init();
  })();
  </script>
</body>
</html>
