<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Negozio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
    #vid, #img {
      width: 100%; height: 100%;
      object-fit: cover;
      position: absolute; top: 0; left: 0;
      display: none;
    }
    #vid.active, #img.active { display: block; }
  </style>
</head>
<body>
  <video id="vid" autoplay muted playsinline></video>
  <img id="img" />
  <script>
  (function () {
    'use strict';

    const vid = document.getElementById('vid');
    const img = document.getElementById('img');

    // ── State ──────────────────────────────────────────────────────────────
    let clips = [];
    let promos = [];
    let clipIdx = 0;
    let cycleCount = 0;
    let mode = 'normal';       // 'normal' | 'exclusive'
    let exclusivePromos = [];
    let exclusiveIdx = 0;
    let pendingInter = [];     // interstiziali queued for between-cycle playback
    let watchdogTimer = null;
    let endedHandler = null;

    // ── Utilities ──────────────────────────────────────────────────────────
    const IMAGE_RE = /\.(jpe?g|png|gif|webp|bmp|svg)$/i;
    function isImage(f) { return IMAGE_RE.test(f); }

    function todayISO() { return new Date().toISOString().slice(0, 10); }

    function showOnly(el) {
      vid.classList.remove('active');
      img.classList.remove('active');
      if (el) el.classList.add('active');
    }

    function clearWatchdog() {
      if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; }
    }

    function clearEndedHandler() {
      if (endedHandler) { vid.removeEventListener('ended', endedHandler); endedHandler = null; }
    }

    // ── Manifest loading ───────────────────────────────────────────────────
    async function loadManifest() {
      try {
        const r = await fetch('manifest.json?t=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      } catch (e) {
        console.warn('[negozio-tv] manifest non disponibile, riprovo tra 10s', e);
        await new Promise(res => setTimeout(res, 10000));
        return loadManifest();
      }
    }

    // ── Mode evaluation ────────────────────────────────────────────────────
    function evaluateMode() {
      const t = todayISO();
      exclusivePromos = promos.filter(p => {
        const c = p.config;
        return c.modalita === 'esclusiva' && c.dal <= t && t <= c.al;
      });
      mode = exclusivePromos.length > 0 ? 'exclusive' : 'normal';
    }

    function scheduleMidnightReset() {
      const now = new Date();
      const midnight = new Date(now);
      midnight.setDate(now.getDate() + 1);
      midnight.setHours(0, 0, 10, 0); // 10s dopo mezzanotte
      setTimeout(() => {
        evaluateMode();
        exclusiveIdx = 0;
        clipIdx = 0;
        cycleCount = 0;
        pendingInter = [];
        clearWatchdog();
        clearEndedHandler();
        showOnly(null);
        mode === 'exclusive' ? runExclusive() : runNormal();
        scheduleMidnightReset();
      }, midnight - now);
    }

    // ── Generic item player ────────────────────────────────────────────────
    function playItem(path, imageDurationSec, onEnd) {
      clearWatchdog();
      clearEndedHandler();

      if (isImage(path)) {
        vid.src = '';
        img.src = path;
        showOnly(img);
        setTimeout(() => { showOnly(null); onEnd(); }, (imageDurationSec || 5) * 1000);
        return;
      }

      // Video
      showOnly(vid);
      vid.src = path;
      vid.currentTime = 0;

      endedHandler = () => {
        clearEndedHandler();
        clearWatchdog();
        showOnly(null);
        onEnd();
      };
      vid.addEventListener('ended', endedHandler);

      // Watchdog: rileva pausa inattesa o video bloccato
      let lastTime = -1;
      let stuckTicks = 0;
      watchdogTimer = setInterval(() => {
        if (vid.paused && !vid.ended) {
          vid.play().catch(() => {});
          stuckTicks = 0;
        } else if (!vid.paused && !vid.ended && vid.currentTime === lastTime) {
          if (++stuckTicks >= 3) { // 9s bloccato → forza avanzamento
            clearWatchdog();
            clearEndedHandler();
            showOnly(null);
            onEnd();
          }
        } else {
          stuckTicks = 0;
        }
        lastTime = vid.currentTime;
      }, 3000);

      vid.play().catch(() => {
        // Autoplay bloccato: riprova al primo clic
        document.addEventListener('click', () => vid.play(), { once: true });
      });
    }

    // ── Exclusive mode ─────────────────────────────────────────────────────
    function runExclusive() {
      if (!exclusivePromos.length) { runNormal(); return; }
      playExclusiveSlot();
    }

    function playExclusiveSlot() {
      const p = exclusivePromos[exclusiveIdx % exclusivePromos.length];
      exclusiveIdx++;
      const intervalMs = (p.config.ogni_n_minuti || 15) * 60 * 1000;
      const t0 = Date.now();

      playItem('promo/' + p.file, p.config.durata_immagine_secondi, () => {
        const remaining = Math.max(0, intervalMs - (Date.now() - t0));
        // Schermo nero fino al prossimo intervallo
        setTimeout(playExclusiveSlot, remaining);
      });
    }

    // ── Normal mode ────────────────────────────────────────────────────────
    function runNormal() {
      if (!clips.length) return;
      cycleCount = 1;
      checkInterstiziali();
      pendingInter.length ? playInterQueue() : playClip();
    }

    function checkInterstiziali() {
      const due = promos.filter(p => {
        if (p.config.modalita !== 'interstiziale') return false;
        const n = p.config.ogni_n_cicli || 5;
        return cycleCount > 0 && cycleCount % n === 0;
      });

      if (!due.length) return;

      // Ruota l'ordine di inserimento ad ogni ciclo per "alternare"
      const offset = cycleCount % due.length;
      const ordered = [...due.slice(offset), ...due.slice(0, offset)];
      ordered.forEach(p => {
        if (!pendingInter.find(x => x.file === p.file)) pendingInter.push(p);
      });
    }

    function playClip() {
      const file = clips[clipIdx];
      clipIdx++;
      if (clipIdx >= clips.length) {
        clipIdx = 0;
        cycleCount++;
        checkInterstiziali();
      }
      playItem('clip/' + file, null, afterClip);
    }

    function afterClip() {
      pendingInter.length ? playInterQueue() : playClip();
    }

    function playInterQueue() {
      if (!pendingInter.length) { playClip(); return; }
      const p = pendingInter.shift();
      playItem('promo/' + p.file, p.config.durata_immagine_secondi, playInterQueue);
    }

    // ── Entry point ────────────────────────────────────────────────────────
    async function init() {
      const manifest = await loadManifest();
      clips  = manifest.clips  || [];
      promos = manifest.promos || [];
      evaluateMode();
      scheduleMidnightReset();
      mode === 'exclusive' ? runExclusive() : runNormal();
    }

    init();
  })();
  </script>
</body>
</html>
